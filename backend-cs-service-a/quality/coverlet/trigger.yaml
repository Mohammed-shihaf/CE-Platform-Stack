tool: coverlet
language: csharp
version: "net8.0"
techniques:
  - Statement Coverage
  - Branch Coverage
  - Coverage Delta
metrics:
  - Statement Coverage %
  - Branch Coverage %
  - Coverage Delta %
primary: true
secondary: coverlet-delta
run_command: dotnet test /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura
threshold:
  line: 80
  branch: 75
output: quality/coverlet/report/
