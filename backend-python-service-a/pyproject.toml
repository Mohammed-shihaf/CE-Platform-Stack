[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "backend-python-service-a"
version = "1.0.0"
description = "CE Platform — Python Service A (FastAPI + gRPC + MongoDB)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "grpcio>=1.67.0",
    "grpcio-tools>=1.67.0",
    "pymongo>=4.10.1",
    "pydantic>=2.10.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "mutmut>=3.7.0",
    "cosmic-ray>=8.7.0",
    "beniget>=0.5.0",
    "pyflakes>=3.4.0",
    "bandit>=1.9.4",
    "copydetect>=0.5.0",
    "pydriller>=2.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov=analysis --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=80 -v"

[tool.coverage.run]
branch = true
source = ["src", "analysis"]
omit = ["tests/*", "src/main.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "def serve",
]

[tool.mutmut]
paths_to_mutate = "analysis/,src/"
tests_dir = "tests/"
runner = "python -m pytest"
